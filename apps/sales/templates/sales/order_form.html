{% extends 'base.html' %}

{% block content %}

<div class="container-fluid">

<form method="post">

    {% csrf_token %}

    <!-- ========================= -->
    <!-- Order Information -->
    <!-- ========================= -->

    <div class="card shadow-sm mb-3">

        <div class="card-header">
            <h4>Create Order</h4>
        </div>

        <div class="card-body">

            <div class="row g-3">

                <div class="col-lg-4">

                    <label class="form-label">
                        Customer
                    </label>

                    <select
                        name="customer"
                        id="customer-select"
                        class="form-select"
                        required>
                    </select>

                </div>

                <div class="col-lg-3">

                    <label class="form-label">
                        Order Type
                    </label>

                    <select
                        name="order_type"
                        class="form-select">

                        <option value="stock">
                            Stock Order
                        </option>

                        <option value="factory">
                            Factory Order
                        </option>

                        <option value="mixed">
                            Mixed Order
                        </option>

                    </select>

                </div>

                <div class="col-lg-5">

                    <label class="form-label">
                        Notes
                    </label>

                    <textarea
                        name="notes"
                        rows="2"
                        class="form-control"></textarea>

                </div>

            </div>

        </div>

    </div>


    <!-- ========================= -->
    <!-- Product Search -->
    <!-- ========================= -->

    <div class="card shadow-sm mb-3">

        <div class="card-header">

            <div class="row">

                <div class="col-lg-9">

                    <label class="form-label">

                        Search Product / SKU

                    </label>

                    <select
                        id="variant-search"
                        class="form-select">
                    </select>

                </div>

                <div class="col-lg-3 d-flex align-items-end">

                    <button
                        type="button"
                        id="add-item"
                        class="btn btn-success w-100">

                        <i class="bi bi-plus-circle"></i>

                        Add Item

                    </button>

                </div>

            </div>

        </div>

    </div>


    <!-- ========================= -->
    <!-- Order Items -->
    <!-- ========================= -->

    <div class="card shadow-sm mb-3">

        <div class="card-body p-0">

            <div class="table-responsive">

                <table class="table table-bordered table-hover align-middle mb-0">

                    <thead class="table-light">

                        <tr>

                            <th width="120">
                                SKU
                            </th>

                            <th>
                                Product
                            </th>

                            <th width="90">
                                Size
                            </th>

                            <th width="90">
                                Color
                            </th>

                            <th width="150">
                                Factory
                            </th>

                            <th width="100">
                                Stock
                            </th>

                            <th width="110">
                                Remaining
                            </th>

                            <th width="120">
                                Price
                            </th>

                            <th width="100">
                                Qty
                            </th>

                            <th width="120">
                                Total
                            </th>

                            <th width="80">
                                Action
                            </th>

                        </tr>

                    </thead>

                    <tbody id="order-items">

                        <tr id="empty-row">

                            <td
                                colspan="11"
                                class="text-center text-muted py-4">

                                No products added.

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>


    <!-- ========================= -->
    <!-- Footer -->
    <!-- ========================= -->

    <div class="card shadow-sm">

        <div class="card-body">

            <div class="row align-items-center">

                <div class="col-lg-6">

                    <button
                        type="button"
                        id="clear-items"
                        class="btn btn-outline-danger">

                        Clear Items

                    </button>

                </div>

                <div class="col-lg-6 text-end">

                    <h3 class="mb-3">

                        Grand Total :

                        <span
                            id="grand-total"
                            class="text-primary">

                            0.00

                        </span>

                    </h3>

                    <button
                        class="btn btn-primary btn-lg">

                        Save Order

                    </button>

                </div>

            </div>

        </div>

    </div>

</form>

</div>

{% endblock %}

{% block extra_js %}

<script>

$(function () {

    let selectedVariant = null;

    // ==========================
    // Customer Search
    // ==========================

    $('#customer-select').select2({

        width: '100%',
        placeholder: 'Search Customer',

        ajax: {

            url: "{% url 'sales:customer_search' %}",
            dataType: "json",
            delay: 250,

            data: function (params) {

                return {
                    term: params.term || ''
                };

            },

            processResults: function (data) {

                return data;

            }

        }

    });


    // ==========================
    // Variant Search
    // ==========================

    $('#variant-search').select2({

        width: '100%',
        placeholder: 'Search SKU / Product',

        ajax: {

            url: "{% url 'sales:variant_search' %}",
            dataType: 'json',
            delay: 250,

            data: function (params) {

                return {
                    term: params.term || ''
                };

            },

            processResults: function (data) {

                return data;

            }

        }

    });


    $('#variant-search').on('select2:select', function (e) {

        selectedVariant = e.params.data;

    });


    // ==========================
    // Add Item
    // ==========================

    $('#add-item').click(function () {

        if (!selectedVariant) {

            alert("Please select a product.");
            return;

        }

        let stock = parseInt(selectedVariant.stock);

        if (stock <= 0) {

            alert("This item is out of stock.");
            return;

        }

        // Prevent duplicate variant

        let exists = false;

        $('input[name="variant_id[]"]').each(function () {

            if ($(this).val() == selectedVariant.id) {

                exists = true;

            }

        });

        if (exists) {

            alert("This product has already been added.");
            return;

        }

        $('#empty-row').remove();

        let total = parseFloat(selectedVariant.price).toFixed(2);

        let row = `

        <tr>

            <td>

                ${selectedVariant.sku}

                <input
                    type="hidden"
                    name="variant_id[]"
                    value="${selectedVariant.id}">

            </td>

            <td>${selectedVariant.product}</td>

            <td>${selectedVariant.size}</td>

            <td>${selectedVariant.color}</td>

            <td>${selectedVariant.factory}</td>

            <td class="stock">

                ${stock}

            </td>

            <td>

                <span class="remaining-stock">

                    ${stock-1}

                </span>

            </td>

            <td>

                <input
                    type="number"
                    class="form-control price"
                    step="0.01"
                    name="price[]"
                    value="${selectedVariant.price}">

            </td>

            <td>

                <input
                    type="number"
                    class="form-control qty"
                    name="qty[]"
                    value="1"
                    min="1"
                    max="${stock}">

            </td>

            <td>

                <span class="line-total">

                    ${total}

                </span>

            </td>

            <td>

                <button
                    type="button"
                    class="btn btn-danger btn-sm remove-row">

                    Remove

                </button>

            </td>

        </tr>

        `;

        $('#order-items').append(row);

        calculateGrand();

    });


    // ==========================
    // Qty / Price Changed
    // ==========================

    $(document).on('keyup change', '.qty,.price', function () {

        let row = $(this).closest('tr');

        let stock = parseInt(row.find('.stock').text());

        let qty = parseInt(row.find('.qty').val()) || 1;

        if (qty < 1) {

            qty = 1;

            row.find('.qty').val(1);

        }

        if (qty > stock) {

            qty = stock;

            row.find('.qty').val(stock);

            alert("Only " + stock + " item(s) available.");

        }

        let remaining = stock - qty;

        row.find('.remaining-stock').text(remaining);

        let price = parseFloat(row.find('.price').val()) || 0;

        let total = qty * price;

        row.find('.line-total').text(total.toFixed(2));

        calculateGrand();

    });


    // ==========================
    // Remove Item
    // ==========================

    $(document).on('click', '.remove-row', function () {

        $(this).closest('tr').remove();

        if ($('#order-items tr').length === 0) {

            $('#order-items').html(

                `<tr id="empty-row">
                    <td colspan="11" class="text-center text-muted py-4">
                        No products added.
                    </td>
                </tr>`

            );

        }

        calculateGrand();

    });


    // ==========================
    // Clear All
    // ==========================

    $('#clear-items').click(function () {

        $('#order-items').html(

            `<tr id="empty-row">
                <td colspan="11" class="text-center text-muted py-4">
                    No products added.
                </td>
            </tr>`

        );

        calculateGrand();

    });


    // ==========================
    // Grand Total
    // ==========================

    function calculateGrand() {

        let grand = 0;

        $('.line-total').each(function () {

            grand += parseFloat($(this).text()) || 0;

        });

        $('#grand-total').text(grand.toFixed(2));

    }

});

</script>

{% endblock %}
